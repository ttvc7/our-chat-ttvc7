<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');

function load(key, def) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; }
  catch (e) { return def; }
}
function save(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
}

let cards = load('our_cards', []);
let quoteTarget = null;

function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
  const page = document.getElementById(id);
  if (page) page.classList.remove('hidden');
  if (id === 'chatPage') {
    refreshMessages();
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
}

setTimeout(() => {
  const loading = document.getElementById('loading');
  if (loading) { loading.classList.add('fade-out'); setTimeout(() => loading.remove(), 700); }
}, 1000);

/* ===== 消息基础渲染 ===== */
function buildAvatar(sender) {
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  const isMe = sender === 'me';
  const avatarUrl = isMe ? load('my_avatar', '') : load('ta_avatar', '');
  if (avatarUrl) { avatar.style.background = `url(${avatarUrl}) center/cover no-repeat`; avatar.textContent = ''; }
  else { const name = isMe ? load('my_name', '我') : load('ta_name', 'TA'); avatar.textContent = name.charAt(0); }
  return avatar;
}

function addMessage(sender, content, quote, store) {
  const row = document.createElement('div');
  row.className = 'msg-row ' + (sender === 'me' ? 'me' : 'ta');
  const avatar = buildAvatar(sender);
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  if (quote) {
    const q = document.createElement('span'); q.className = 'quote-block'; q.textContent = quote; bubble.appendChild(q);
  }
  bubble.appendChild(document.createTextNode(content));
  row.appendChild(avatar); row.appendChild(bubble);
  messagesEl.appendChild(row); messagesEl.scrollTop = messagesEl.scrollHeight;
  if (store !== false) {
    const msgs = load('our_messages', []);
    msgs.push({ type: 'text', sender, content, quote: quote || '', t: Date.now() });
    save('our_messages', msgs);
  }
}

function addImage(sender, url, store) {
  const row = document.createElement('div');
  row.className = 'msg-row ' + (sender === 'me' ? 'me' : 'ta');
  const avatar = buildAvatar(sender);
  const img = document.createElement('img');
  img.src = url; img.style.maxWidth = '120px'; img.style.maxHeight = '120px'; img.style.borderRadius = '8px';
  row.appendChild(avatar); row.appendChild(img);
  messagesEl.appendChild(row); messagesEl.scrollTop = messagesEl.scrollHeight;
  if (store !== false) { const msgs = load('our_messages', []); msgs.push({ type: 'image', sender, url, t: Date.now() }); save('our_messages', msgs); }
}

function showTyping() {
  const taNameEl = document.getElementById('taName');
  if (taNameEl && !taNameEl.dataset.typing) { taNameEl.dataset.original = taNameEl.textContent; taNameEl.dataset.typing = '1'; taNameEl.textContent = '对方正在输入中…'; }
}
function hideTyping() {
  const taNameEl = document.getElementById('taName');
  if (taNameEl && taNameEl.dataset.typing) { taNameEl.textContent = taNameEl.dataset.original || load('ta_name', 'TA'); delete taNameEl.dataset.typing; }
}

function drawCardText() {
  const mainCards = cards.filter(c => (c.type || 'main') === 'main');
  const emojiCards = cards.filter(c => c.type === 'emoji');
  const emojiProb = load('emoji_prob', 10);
  const roll = Math.random() * 100;
  if (emojiCards.length > 0 && roll < emojiProb) return emojiCards[Math.floor(Math.random() * emojiCards.length)].content;
  if (mainCards.length > 0) return mainCards[Math.floor(Math.random() * mainCards.length)].content;
  return '（字卡库还是空的，点右上角添加一些吧）';
}

function drawQuote() {
  const quoteProb = load('quote_prob', 30);
  if (Math.random() * 100 >= quoteProb) return '';
  const msgs = load('our_messages', []).filter(m => m.type === 'text' && m.sender === 'me');
  if (msgs.length === 0) return '';
  return '你：' + msgs[Math.floor(Math.random() * msgs.length)].content;
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = '';
  addMessage('me', text, '', true);
  const rMin = load('reply_min', 1), rMax = load('reply_max', 1);
  const dMin = load('delay_min', 5), dMax = load('delay_max', 15);
  showTyping();
  await new Promise(r => setTimeout(r, (Math.min(dMin, dMax) + Math.random() * Math.abs(dMax - dMin)) * 1000));
  const count = Math.min(rMin, rMax) + Math.floor(Math.random() * (Math.abs(rMax - rMin) + 1));
  for (let i = 0; i < count; i++) {
    if (i > 0) { await new Promise(r => setTimeout(r, 500 + Math.random() * 1500)); showTyping(); await new Promise(r => setTimeout(r, 400)); }
    hideTyping();
    addMessage('ta', drawCardText(), drawQuote(), true);
  }
  hideTyping();
}
document.getElementById('sendBtn').onclick = sendMessage;
inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

/* ===== 转账逻辑 ===== */
function renderTransferCard(m) {
  const isMe = m.sender === 'me';
  const row = document.createElement('div');
  row.className = 'msg-row ' + (isMe ? 'me' : 'ta');
  row.style.maxWidth = '70%';
  const avatar = buildAvatar(m.sender);
  const card = document.createElement('div');
  card.className = 'transfer-card';
  if (m.status === 'received') card.classList.add('received');
  if (m.status === 'refunded') card.classList.add('refunded');
  const icon = document.createElement('div');
  icon.className = 'transfer-card-icon';
  if (m.status === 'received') icon.innerHTML = '✓';
  else if (m.status === 'refunded') icon.innerHTML = '↩';
  else icon.innerHTML = '¥';
  const info = document.createElement('div');
  info.className = 'transfer-card-info';
  const statusText = m.status === 'received' ? '已收款' : (m.status === 'refunded' ? '已退还' : '待收款');
  info.innerHTML = `<div class="tc-amount">¥${(m.amount || 0).toFixed(2)}</div><div class="tc-status">${statusText}</div>`;
  card.appendChild(icon); card.appendChild(info);
  const label = document.createElement('div');
  label.className = 'transfer-card-label'; label.textContent = '转账'; card.appendChild(label);
  card.onclick = () => openReceiveModal(m.transferId);
  row.appendChild(avatar); row.appendChild(card);
  messagesEl.appendChild(row); messagesEl.scrollTop = messagesEl.scrollHeight;
}

function makeTransferCard(amount, note) {
  const transferId = Date.now() + '_' + Math.random().toString(36).slice(2, 8);
  const t = Date.now();
  const msgs = load('our_messages', []);
  msgs.push({ type: 'transfer', from: 'me', sender: 'me', transferId, amount, note, status: 'pending', t });
  msgs.push({ type: 'transfer', from: 'me', sender: 'ta', transferId, amount, note, status: 'pending', t: t + 1 });
  save('our_messages', msgs);
  renderTransferCard({ type: 'transfer', from: 'me', sender: 'me', transferId, amount, note, status: 'pending', t });
  setTimeout(() => {
    const recv = load('trans_recv', 60);
    const newStatus = (Math.random() * 100 < recv) ? 'received' : 'pending';
    if (newStatus === 'pending') return;
    const all = load('our_messages', []);
    all.forEach(m => { if (m.type === 'transfer' && m.transferId === transferId) m.status = newStatus; });
    save('our_messages', all); refreshMessages();
  }, 2000);
}

function makeTaTransferCard(amount, note) {
  const transferId = Date.now() + '_ta_' + Math.random().toString(36).slice(2, 8);
  const t = Date.now();
  const msgs = load('our_messages', []);
  msgs.push({ type: 'transfer', from: 'ta', sender: 'ta', transferId, amount, note, status: 'pending', t });
  save('our_messages', msgs);
  renderTransferCard({ type: 'transfer', from: 'ta', sender: 'ta', transferId, amount, note, status: 'pending', t });
}

function refreshMessages() {
  messagesEl.innerHTML = '';
  const msgs = load('our_messages', []);
  msgs.forEach(m => {
    if (m.type === 'transfer') renderTransferCard(m);
    else if (m.type === 'image') addImage(m.sender, m.url, false);
    else if (m.type === 'text') addMessage(m.sender, m.content, m.quote, false);
  });
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

let currentTransferId = null;
function openReceiveModal(id) {
  const msgs = load('our_messages', []);
  const msg = msgs.find(m => m.type === 'transfer' && m.transferId === id);
  if (!msg) return;
  currentTransferId = id;
  document.getElementById('receiveModal').classList.remove('hidden');
}
document.getElementById('closeReceiveBtn').onclick = () => document.getElementById('receiveModal').classList.add('hidden');
document.getElementById('receiveConfirmBtn').onclick = () => {
  const msgs = load('our_messages', []);
  const msg = msgs.find(m => m.type === 'transfer' && m.transferId === currentTransferId);
  if (msg && msg.status === 'pending' && msg.from === 'ta') {
    msgs.forEach(m => { if (m.type === 'transfer' && m.transferId === currentTransferId) m.status = 'received'; });
    save('our_messages', msgs);
  }
  document.getElementById('receiveModal').classList.add('hidden');
  refreshMessages();
};

/* ===== 菜单绑定 ===== */
document.getElementById('backHomeBtn').onclick = () => showPage('homePage');
document.getElementById('menuSettings').onclick = () => { document.getElementById('menuPopup').classList.remove('show'); document.getElementById('settingsModal').classList.remove('hidden'); };
document.getElementById('menuCards').onclick = () => { document.getElementById('menuPopup').classList.remove('show'); document.getElementById('cardModal').classList.remove('hidden'); loadCards(); };
document.getElementById('closeCardBtn').onclick = () => document.getElementById('cardModal').classList.add('hidden');
document.getElementById('closeSettingsBtn').onclick = () => document.getElementById('settingsModal').classList.add('hidden');

document.getElementById('plusBtn').onclick = () => document.getElementById('plusMenu').classList.toggle('hidden');
document.querySelectorAll('.plus-item').forEach(item => {
  item.onclick = () => {
    document.getElementById('plusMenu').classList.add('hidden');
    if (item.dataset.key === 'transfer') document.getElementById('transferModal').classList.remove('hidden');
    else alert('该功能待开发');
  };
});
document.getElementById('closeTransferBtn').onclick = () => document.getElementById('transferModal').classList.add('hidden');
document.getElementById('confirmTransferBtn').onclick = () => {
  const amount = parseFloat(document.getElementById('transferAmount').value);
  if (!amount || amount <= 0) return alert('请输入有效金额');
  document.getElementById('transferModal').classList.add('hidden');
  makeTransferCard(amount, document.getElementById('transferNote').value.trim());
};

/* ===== 字卡库 ===== */
let currentCat = 'all', currentSearch = '';
function loadCards() {
  const list = document.getElementById('cardList');
  if (!list) return;
  let allMain = cards.map((c, idx) => ({ ...c, _idx: idx })).filter(c => c.type === 'main' || !c.type);
  if (currentSearch) allMain = allMain.filter(c => (c.content || '').includes(currentSearch));
  if (allMain.length === 0) { list.innerHTML = '<div style="text-align:center;color:#999;padding:20px;">暂无字卡</div>'; return; }
  list.innerHTML = '';
  allMain.forEach(card => {
    const div = document.createElement('div'); div.className = 'card-item';
    div.innerHTML = `<div style="flex:1;">${card.content}</div><button>×</button>`;
    div.querySelector('button').onclick = () => { cards.splice(card._idx, 1); save('our_cards', cards); loadCards(); };
    list.appendChild(div);
  });
}
document.getElementById('addCardBtn').onclick = () => {
  const text = document.getElementById('cardInput').value.trim();
  if (!text) return;
  text.split('\n').forEach(l => { if(l.trim()) cards.push({ content: l.trim(), category: '', type: 'main' }); });
  save('our_cards', cards);
  document.getElementById('cardInput').value = '';
  loadCards();
};
</script>

<script>
/* ===== 自动消息（保持简洁） ===== */
let autoMsgTimer = null;
function scheduleAutoMessage() {
  const min = load('auto_msg_min', 1) * 60 * 1000;
  const max = load('auto_msg_max', 5) * 60 * 1000;
  const delay = min + Math.random() * (max - min);
  clearTimeout(autoMsgTimer);
  autoMsgTimer = setTimeout(async () => {
    showTyping();
    await new Promise(r => setTimeout(r, 1000));
    hideTyping();
    addMessage('ta', drawCardText(), drawQuote(), true);
    scheduleAutoMessage();
  }, delay);
}

/* ===== 主页头像/时间 ===== */
function applyHomeAssets() {
  const myA = document.getElementById('homeMyAvatar'), taA = document.getElementById('homeTaAvatar');
  const myNameEl = document.getElementById('homeMyName'), taNameEl = document.getElementById('homeTaName');

  if (myA) { if (myUrl) { myA.style.background = `url(${myUrl}) center/cover no-repeat`; myA.textContent = ''; } else { myA.style.background = '#e5e5e5'; myA.textContent = myName.charAt(0); } }
  if (taA) { if (taUrl) { taA.style.background = `url(${taUrl}) center/cover no-repeat`; taA.textContent = ''; } else { taA.style.background = '#e5e5e5'; taA.textContent = taName.charAt(0); } }

  if (talkTaA) { if (taUrl) { talkTaA.style.background = `url(${taUrl}) center/cover no-repeat`; talkTaA.textContent = ''; } else { talkTaA.style.background = '#e5e5e5'; talkTaA.textContent = taName.charAt(0); } }
}

function updateHomeTime() {
  const el = document.getElementById('homeTime');
  if (el) { const d = new Date(); el.textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
}
setInterval(updateHomeTime, 30000); updateHomeTime();

/* ===== 小卡存图（强制 localStorage，不再丢失） ===== */
function compressImage(file, maxSize, cb) {
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas'); let w = img.width, h = img.height;
      if (w > h) { if (w > maxSize) { h = h * maxSize / w; w = maxSize; } } else { if (h > maxSize) { w = w * maxSize / h; h = maxSize; } }
      canvas.width = w; canvas.height = h; canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL('image/jpeg', 0.85));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function loadHomeBigCard() {
  const img = document.getElementById('homeBigCardImg'), tip = document.getElementById('homeBigCardTip');
  const saved = load('home_card_img_local', '');
  if (saved) { img.src = saved; img.style.display = 'block'; if (tip) tip.style.display = 'none'; }
  else { img.style.display = 'none'; if (tip) tip.style.display = 'block'; }
}

(function() {
  const cardEl = document.getElementById('homeBigCard');
  const upload = document.createElement('input');
  upload.type = 'file'; upload.accept = 'image/*'; upload.style.display = 'none';
  document.body.appendChild(upload);
  cardEl.onclick = () => upload.click();
  upload.onchange = (e) => {
    const file = e.target.files[0]; if (!file) return;
    compressImage(file, 600, (url) => {
      document.getElementById('homeBigCardImg').src = url;
      document.getElementById('homeBigCardImg').style.display = 'block';
      document.getElementById('homeBigCardTip').style.display = 'none';
      save('home_card_img_local', url); // 存入 localStorage
    });
    upload.value = '';
  };
})();

/* ===== 双击寄语 ===== */
(function() {
  const box = document.getElementById('homeQuoteBox'), txt = document.getElementById('homeQuoteText'), wrap = document.getElementById('homeQuote');
  const q = load('home_quote', '');
  if (q) { wrap.classList.add('filled'); txt.textContent = q; }
  function edit() {
    const v = prompt('输入寄语：', load('home_quote', ''));
    if (v === null) return;
    save('home_quote', v.trim());
    if (v.trim()) { wrap.classList.add('filled'); txt.textContent = v.trim(); }
    else { wrap.classList.remove('filled'); box.textContent = '双击寄语'; }
  }
  box.ondblclick = edit; txt.ondblclick = edit;
})();

/* ===== 气泡对话（完美排版） ===== */
(function() {
  const mine = document.getElementById('talkMineBubble'), ta = document.getElementById('talkTaBubble');
  const mv = load('home_talk_mine', ''), tv = load('home_talk_ta', '');
  if (mv) mine.textContent = mv;

  ta.onclick = () => {

  };
})();

/* ===== 纪念日（绝对不卡死） ===== */
let annivPickerY = 2024, annivPickerM = 1, annivPickerD = 1;

function renderAnniv() {
  const start = localStorage.getItem('anniv_start') || '';
  const daysEl = document.getElementById('annivDays');
  if (start) {
    const diff = Math.floor((Date.now() - new Date(start).getTime()) / 86400000);
    daysEl.textContent = diff >= 0 ? diff : 0;
  } else daysEl.textContent = '--';
  
  const el = document.getElementById('homeAnnivNum');
  if (el) el.textContent = daysEl.textContent;
}

document.getElementById('homeAnnivCard').onclick = () => { showPage('annivPage'); renderAnniv(); };

/* ===== 底部菜单绑定 ===== */
document.querySelectorAll('.home-grid-2x2 .home-item').forEach(item => {

</script>
