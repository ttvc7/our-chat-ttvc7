<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>我们的聊天</title>
<link rel="icon" href="IMG_20260923_234816.jpg">
<link rel="manifest" href="manifest.json">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #f5f5f5;
}

/* ===== 加载页 ===== */
#loading {
  position: fixed;
  inset: 0;
  background: #f2f0ee;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 999;
  transition: opacity 0.6s ease;
}
#loading.fade-out { opacity: 0; pointer-events: none; }

.ring {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  border: 3px solid #d8d5d2;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 40px;
}
.dot {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #ffffff;
  box-shadow: 0 0 0 2px #e8e5e2;
  animation: breathe 1.6s ease-in-out infinite;
}
@keyframes breathe {
  0%, 100% { transform: scale(0.6); }
  50% { transform: scale(1.1); }
}

.loading-text {
  font-size: 14px;
  color: #a0a0a0;
  letter-spacing: 1px;
  margin-bottom: 30px;
}

.bar {
  width: 140px;
  height: 2px;
  background: #e0ddd9;
  border-radius: 2px;
  overflow: hidden;
  position: relative;
}
.bar::after {
  content: '';
  position: absolute;
  left: 0; top: 0;
  height: 100%;
  width: 0;
  background: #b8b4b0;
  border-radius: 2px;
  animation: fill 2s linear forwards;
}
@keyframes fill {
  from { width: 0; }
  to { width: 100%; }
}

/* ===== 聊天界面 ===== */
#app {
  width: 100%;
  height: 100vh;
  height: 100dvh;
  background: #f5f5f5;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.chat-header {
  height: 56px;
  background: #f7f7f7;
  border-bottom: 1px solid #e0e0e0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  flex-shrink: 0;
}
.chat-header span { font-size: 17px; font-weight: 600; color: #111; }
#openCardBtn { background: none; border: none; color: #07c160; font-size: 15px; }
#messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px 12px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  -webkit-overflow-scrolling: touch;
}
.msg-row { display: flex; align-items: flex-start; gap: 8px; max-width: 82%; }
.msg-row.me { align-self: flex-end; flex-direction: row-reverse; }
.msg-row.ta { align-self: flex-start; }
.avatar {
  width: 38px; height: 38px; border-radius: 6px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 600; color: #fff;
}
.msg-row.me .avatar { background: #576b95; }
.msg-row.ta .avatar { background: #e8a33d; }
.bubble {
  padding: 10px 14px; border-radius: 8px; font-size: 15px; line-height: 1.5;
  word-break: break-word; white-space: pre-wrap;
}
.msg-row.me .bubble { background: #95ec69; color: #111; }
.msg-row.ta .bubble { background: #fff; color: #111; }
.typing { display: inline-flex; gap: 4px; padding: 4px 0; }
.typing span {
  width: 6px; height: 6px; border-radius: 50%;
  background: #999; animation: blink 1.2s infinite;
}
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%,60%,100% { opacity: .3 } 30% { opacity: 1 } }
.chat-footer {
  display: flex; padding: 8px 10px; background: #f7f7f7;
  border-top: 1px solid #e0e0e0; gap: 8px; flex-shrink: 0;
  padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
}
#input {
  flex: 1; border: 1px solid #ddd; border-radius: 8px;
  padding: 10px 14px; font-size: 15px; outline: none; background: #fff;
}
#send {
  border: none; background: #07c160; color: #fff; padding: 0 20px;
  border-radius: 8px; font-size: 15px; font-weight: 500;
}
#send:active { opacity: .7; }
#send:disabled { opacity: .4; }

.modal { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 99; }
.modal.hidden { display: none; }
.modal-box { width: 90%; max-width: 400px; max-height: 80vh; background: #fff; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
.modal-head { padding: 14px 16px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
.modal-head button { background: none; border: none; font-size: 22px; color: #999; }
.modal-body { padding: 16px; overflow-y: auto; }
#cardInput { width: 100%; height: 70px; border: 1px solid #ddd; border-radius: 8px; padding: 10px; font-size: 14px; resize: none; outline: none; font-family: inherit; }
#addCardBtn { margin-top: 10px; width: 100%; padding: 10px; background: #07c160; color: #fff; border: none; border-radius: 8px; font-size: 15px; }
#cardList { margin-top: 16px; }
.card-item { padding: 10px 12px; background: #f7f7f7; border-radius: 8px; margin-bottom: 8px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.card-item span { flex: 1; word-break: break-word; }
.card-item button { background: none; border: none; color: #e74c3c; font-size: 18px; flex-shrink: 0; }
</style>
</head>
<body>

<!-- 加载页 -->
<div id="loading">
  <div class="ring">
    <div class="dot"></div>
  </div>
  <div class="loading-text">正在连接你和 TA 的世界…</div>
  <div class="bar"></div>
</div>

<!-- 聊天界面 -->
<div id="app">
  <header class="chat-header">
    <span id="taName">TA</span>
    <button id="openCardBtn">字卡</button>
  </header>
  <div id="messages"></div>
  <footer class="chat-footer">
    <input id="input" type="text" placeholder="输入消息…" autocomplete="off">
    <button id="send">发送</button>
  </footer>
</div>

<div id="cardModal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <span>TA 的字卡库</span>
      <button id="closeCardBtn">×</button>
    </div>
    <div class="modal-body">
      <textarea id="cardInput" placeholder="输入一句 TA 可能说的话…"></textarea>
      <button id="addCardBtn">添加字卡</button>
      <div id="cardList"></div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://znbrbhmpiittbhywugri.supabase.co';
const SUPABASE_KEY = 'sb_publishable_BgXEgg54eM8cPpXRS7rviw_Ru-PlSLh';
const TA_NAME = 'TA';
const MY_NAME = '我';
const MIN_DELAY = 900;
const MAX_DELAY = 2200;

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendEl = document.getElementById('send');
document.getElementById('taName').textContent = TA_NAME;

// 2 秒后隐藏加载页
setTimeout(() => {
  const loading = document.getElementById('loading');
  loading.classList.add('fade-out');
  setTimeout(() => loading.remove(), 600);
}, 2000);

function addMessage(sender, content) {
  const row = document.createElement('div');
  row.className = 'msg-row ' + (sender === 'me' ? 'me' : 'ta');
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = sender === 'me' ? MY_NAME : TA_NAME.charAt(0);
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = content;
  row.appendChild(avatar);
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
function showTyping() {
  const row = document.createElement('div');
  row.className = 'msg-row ta';
  row.id = 'typing';
  row.innerHTML = '<div class="avatar">' + TA_NAME.charAt(0) + '</div><div class="bubble"><span class="typing"><span></span><span></span><span></span></span></div>';
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
function hideTyping() { const t = document.getElementById('typing'); if (t) t.remove(); }

async function drawCard() {
  const { data, error } = await db.from('cards').select('content, weight').eq('enabled', true);
  if (error || !data || data.length === 0) return '（字卡库还是空的，点右上角添加一些吧）';
  const total = data.reduce((s, c) => s + (c.weight || 1), 0);
  let r = Math.random() * total;
  for (const c of data) { r -= (c.weight || 1); if (r <= 0) return c.content; }
  return data[data.length - 1].content;
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = '';
  sendEl.disabled = true;
  addMessage('me', text);
  await db.from('messages').insert({ sender: 'me', content: text });
  showTyping();
  const delay = MIN_DELAY + Math.random() * (MAX_DELAY - MIN_DELAY);
  await new Promise(r => setTimeout(r, delay));
  const reply = await drawCard();
  hideTyping();
  addMessage('ta', reply);
  await db.from('messages').insert({ sender: 'ta', content: reply });
  sendEl.disabled = false;
}
sendEl.addEventListener('click', sendMessage);
inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

async function loadHistory() {
  const { data, error } = await db.from('messages').select('*').order('created_at', { ascending: true }).limit(200);
  if (error || !data) return;
  if (data.length === 0) { addMessage('ta', '你来啦，我一直在等你。'); return; }
  data.forEach(m => addMessage(m.sender, m.content));
}
loadHistory();

const modal = document.getElementById('cardModal');
document.getElementById('openCardBtn').onclick = () => { modal.classList.remove('hidden'); loadCards(); };
document.getElementById('closeCardBtn').onclick = () => modal.classList.add('hidden');

async function loadCards() {
  const list = document.getElementById('cardList');
  list.innerHTML = '加载中…';
  const { data, error } = await db.from('cards').select('*').order('created_at', { ascending: false });
  if (error) { list.textContent = '加载失败：' + error.message; return; }
  if (!data || data.length === 0) {
    list.innerHTML = '<div style="color:#999;font-size:13px;">还没有字卡，加一条试试</div>';
    return;
  }
  list.innerHTML = '';
  data.forEach(card => {
    const div = document.createElement('div');
    div.className = 'card-item';
    const s = document.createElement('span');
    s.textContent = card.content;
    const btn = document.createElement('button');
    btn.textContent = '×';
    btn.onclick = async () => {
      await db.from('cards').delete().eq('id', card.id);
      loadCards();
    };
    div.appendChild(s); div.appendChild(btn);
    list.appendChild(div);
  });
}

document.getElementById('addCardBtn').onclick = async () => {
  const input = document.getElementById('cardInput');
  const content = input.value.trim();
  if (!content) return;
  const { error } = await db.from('cards').insert({ content, weight: 1, enabled: true });
  if (error) { alert('添加失败：' + error.message); return; }
  input.value = '';
  loadCards();
};
</script>
</body>
  </html>
