      <script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');

function load(key, def) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; }
  catch (e) { return def; }
}
function save(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
}

let cards = load('our_cards', []);

function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
  const page = document.getElementById(id);
  if (page) page.classList.remove('hidden');
}

setTimeout(() => {
  const loading = document.getElementById('loading');
  if (loading) {
    loading.classList.add('fade-out');
    setTimeout(() => loading.remove(), 700);
  }
}, 2000);

function addMessage(sender, content, quote, store) {
  const row = document.createElement('div');
  row.className = 'msg-row ' + (sender === 'me' ? 'me' : 'ta');
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  const isMe = sender === 'me';
  const avatarUrl = isMe ? load('my_avatar', '') : load('ta_avatar', '');
  if (avatarUrl) {
    avatar.style.background = `url(${avatarUrl}) center/cover no-repeat`;
    avatar.textContent = '';
  } else {
    const name = isMe ? load('my_name', '我') : load('ta_name', 'TA');
    avatar.textContent = name.charAt(0);
  }
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  if (quote) {
    const q = document.createElement('span');
    q.className = 'quote-block';
    q.textContent = quote;
    bubble.appendChild(q);
  }
  bubble.appendChild(document.createTextNode(content));
  row.appendChild(avatar);
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  if (store !== false) {
    const msgs = load('our_messages', []);
    msgs.push({ type: 'text', sender, content, quote: quote || '', t: Date.now() });
    save('our_messages', msgs);
  }
}

function addImage(sender, url, store) {
  const row = document.createElement('div');
  row.className = 'msg-row ' + (sender === 'me' ? 'me' : 'ta');
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  const isMe = sender === 'me';
  const avatarUrl = isMe ? load('my_avatar', '') : load('ta_avatar', '');
  if (avatarUrl) {
    avatar.style.background = `url(${avatarUrl}) center/cover no-repeat`;
    avatar.textContent = '';
  } else {
    const name = isMe ? load('my_name', '我') : load('ta_name', 'TA');
    avatar.textContent = name.charAt(0);
  }
  const img = document.createElement('img');
  img.src = url;
  img.style.maxWidth = '120px';
  img.style.maxHeight = '120px';
  img.style.borderRadius = '8px';
  row.appendChild(avatar);
  row.appendChild(img);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  if (store !== false) {
    const msgs = load('our_messages', []);
    msgs.push({ type: 'image', sender, url, t: Date.now() });
    save('our_messages', msgs);
  }
}

function showTyping() {
  const taNameEl = document.getElementById('taName');
  if (taNameEl && !taNameEl.dataset.typing) {
    taNameEl.dataset.original = taNameEl.textContent;
    taNameEl.dataset.typing = '1';
    taNameEl.textContent = '对方正在输入中…';
  }
}
function hideTyping() {
  const taNameEl = document.getElementById('taName');
  if (taNameEl && taNameEl.dataset.typing) {
    taNameEl.textContent = taNameEl.dataset.original || load('ta_name', 'TA');
    delete taNameEl.dataset.typing;
  }
}

function drawCardText() {
  const mainCards = cards.filter(c => (c.type || 'main') === 'main');
  const emojiCards = cards.filter(c => c.type === 'emoji');
  const emojiProb = load('emoji_prob', 10);
  const roll = Math.random() * 100;
  if (emojiCards.length > 0 && roll < emojiProb) {
    return emojiCards[Math.floor(Math.random() * emojiCards.length)].content;
  }
  if (mainCards.length > 0) {
    return mainCards[Math.floor(Math.random() * mainCards.length)].content;
  }
  return '（字卡库还是空的，点右上角添加一些吧）';

function makeTransferCard(amount, note) {
  const transferId = Date.now() + '_' + Math.random().toString(36).slice(2, 8);
  const t = Date.now();
  const msgs = load('our_messages', []);
  msgs.push({ type: 'transfer', from: 'me', sender: 'me', transferId, amount, note, status: 'pending', t });
  msgs.push({ type: 'transfer', from: 'me', sender: 'ta', transferId, amount, note, status: 'pending', t: t + 1 });
  save('our_messages', msgs);
  renderTransferCard({ type: 'transfer', from: 'me', sender: 'me', transferId, amount, note, status: 'pending', t });
  setTimeout(() => {
    const recv = load('trans_recv', 60), ref = load('trans_ref', 30), ign = load('trans_ign', 10);
    const total = recv + ref + ign;
    const r = Math.random() * total;
    let newStatus = 'pending';
    if (r < recv) newStatus = 'received';
    else if (r < recv + ref) newStatus = 'refunded';
    if (newStatus === 'pending') return;
    const all = load('our_messages', []);
    all.forEach(m => { if (m.type === 'transfer' && m.transferId === transferId) m.status = newStatus; });
    save('our_messages', all);
    refreshMessages();
  }, 2000 + Math.random() * 3000);
}

function parseCards(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(l => l);
  if (lines.length === 0) return [];
  let category = '', startIdx = 0;
  const m = lines[0].match(/^【(.+?)】$/);
  if (m) { category = m[1].trim(); startIdx = 1; }
  const result = [];
  for (let i = startIdx; i < lines.length; i++) result.push({ content: lines[i], category });
  return result;
}

function loadCards() {
  const list = document.getElementById('cardList');
  const catsBox = document.getElementById('cardCats');
  if (!list || !catsBox) return;
  let allMain = cards.map((c, idx) => ({ ...c, _idx: idx })).filter(c => c.type === 'main' || !c.type);
  if (currentSearch) allMain = allMain.filter(c => (c.content || '').includes(currentSearch));
  const cats = new Set();
  allMain.forEach(c => { if (c.category) cats.add(c.category); });
  catsBox.innerHTML = '';
  const allCat = document.createElement('div');
  allCat.className = 'card-cat' + (currentCat === 'all' ? ' active' : '');
  allCat.textContent = '全部';
  allCat.onclick = () => { currentCat = 'all'; loadCards(); };
  catsBox.appendChild(allCat);
  const noCat = document.createElement('div');
  noCat.className = 'card-cat' + (currentCat === '未分类' ? ' active' : '');
  noCat.textContent = '未分类';
  noCat.onclick = () => { currentCat = '未分类'; loadCards(); };
  catsBox.appendChild(noCat);
  cats.forEach(cat => {
    const el = document.createElement('div');
    el.className = 'card-cat' + (currentCat === cat ? ' active' : '');
    el.textContent = cat;
    el.onclick = () => { currentCat = cat; loadCards(); };
    catsBox.appendChild(el);
  });
  let filtered = allMain;
  if (currentCat === '未分类') filtered = filtered.filter(c => !c.category);
  else if (currentCat !== 'all') filtered = filtered.filter(c => c.category === currentCat);
  if (filtered.length === 0) {
    list.innerHTML = '<div style="color:#999;font-size:13px;text-align:center;padding:20px 0;">还没有字卡，加一条试试</div>';
    return;
  }
  list.innerHTML = '';
  filtered.forEach(card => {
    const div = document.createElement('div');
    div.className = 'card-item';
    const wrap = document.createElement('div');
    wrap.style.flex = '1'; wrap.style.wordBreak = 'break-word';
    const s = document.createElement('div');

    btn.onclick = () => { cards.splice(card._idx, 1); save('our_cards', cards); loadCards(); };

(function() {

  const emojiBtn = document.getElementById('emojiBtn');

  function setList(list) { if (currentTab === 'mine') save('my_stickers', list); else save('ta_stickers', list); }
  function render() {
    const list = getList();
    if (list.length === 0) { body.innerHTML = `<div class="sticker-empty">还没有表情哦<br>点右上角"+ 添加"上传图片</div>`; return; }
    body.innerHTML = '';
    list.forEach((url, idx) => {
      const div = document.createElement('div');
      div.className = 'sticker-item';
      div.style.backgroundImage = `url(${url})`;
      const del = document.createElement('button');
      del.className = 'sticker-del'; del.textContent = '×';
      del.onclick = (e) => { e.stopPropagation(); list.splice(idx, 1); setList(list); render(); };
      div.appendChild(del);
      div.onclick = () => { if (currentTab === 'mine') sendSticker(url); else alert('这是对方的表情，你只能添加/删除哦'); };
      body.appendChild(div);
    });
  }
  function compressImage(file, maxSize, cb) {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let w = img.width, h = img.height;
        if (w > h) { if (w > maxSize) { h = h * maxSize / w; w = maxSize; } } else { if (h > maxSize) { w = w * maxSize / h; h = maxSize; } }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        cb(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }
  function sendSticker(url) { addImage('me', url); }
  emojiBtn.onclick = (e) => {
    e.stopPropagation();
    if (panel.classList.contains('hidden')) { panel.classList.remove('hidden'); render(); }
    else panel.classList.add('hidden');
  };
  addBtn.onclick = () => upload.click();
  upload.onchange = (e) => {
    const files = Array.from(e.target.files);
    if (files.length === 0) return;
    const list = getList();
    let done = 0;
    files.forEach(f => { compressImage(f, 300, (url) => { list.push(url); done++; if (done === files.length) { setList(list); render(); } }); });
    upload.value = '';
  };
  document.querySelectorAll('.sticker-tab').forEach(tab => {
    tab.onclick = () => {
      document.querySelectorAll('.sticker-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentTab = tab.dataset.tab;
      render();
    };
  });
  document.addEventListener('click', (e) => {
    if (panel.classList.contains('hidden')) return;
    if (e.target.closest('#stickerPanel') || e.target.closest('#emojiBtn')) return;
    panel.classList.add('hidden');
  });
})();

    if (Math.random() * 100 < transProb) {
      const tMin = load('auto_trans_min', 5), tMax = load('auto_trans_max', 50);
      const amount = tMin + Math.random() * (tMax - tMin);
      makeTaTransferCard(Math.round(amount * 100) / 100, '');
    } else {
      showTyping();
      await new Promise(r => setTimeout(r, 800 + Math.random() * 1200));
      const reply = drawCardText();
      const quote = drawQuote();
      hideTyping();
      addMessage('ta', reply, quote, true);
    }
    scheduleAutoMessage();
  }, delay);
}

let shopItems = load('our_shop_items', []);
let shopOrders = load('our_shop_orders', []);
let editingShopId = null;
let currentDetailId = null;
let pendingShopImage = '';

function saveShopItems() { save('our_shop_items', shopItems); }
function saveShopOrders() { save('our_shop_orders', shopOrders); }

function showShopPage() {
  showPage('shopPage');
  renderShopItems();
  renderShopOrders();
  document.querySelectorAll('.shop-tab').forEach(t => t.classList.remove('active'));
  document.querySelector('.shop-tab[data-tab="items"]').classList.add('active');
  document.getElementById('shopItemsPanel').classList.remove('hidden');
  document.getElementById('shopOrdersPanel').classList.add('hidden');
  document.getElementById('shopAddBtn').style.display = '';
}

function renderShopItems() {
  const box = document.getElementById('shopItemsPanel');
  if (!box) return;
  if (shopItems.length === 0) {
    box.innerHTML = '<div class="shop-empty">还没有商品，点右下角 + 添加一个吧</div>';
    return;
  }
  box.innerHTML = '<div class="shop-item-grid"></div>';
  const grid = box.firstElementChild;
  shopItems.forEach(it => {
    const card = document.createElement('div');
    card.className = 'shop-item-card';
    card.innerHTML = `
      <img src="${it.img || ''}" alt="">
      <div class="shop-item-name">${it.name || '未命名'}</div>
      <div class="shop-item-price">¥${(it.price || 0)}</div>
    `;
    card.onclick = () => openShopDetail(it.id);
    grid.appendChild(card);
  });
}

function renderShopOrders() {
  const box = document.getElementById('shopOrdersPanel');
  if (!box) return;
  if (shopOrders.length === 0) {
    box.innerHTML = '<div class="shop-empty">还没有订单</div>';
    return;
  }
  box.innerHTML = '';
  shopOrders.slice().reverse().forEach(o => {
    const div = document.createElement('div');
    div.className = 'shop-order-item';
    const dir = o.direction === 'me_to_ta' ? '我买给他的' : '他买给我的';
    div.innerHTML = `
      <img src="${o.img || ''}" alt="">
      <div class="shop-order-info">
        <div class="shop-order-title">${o.name || ''}</div>
        <div class="shop-order-sub">${dir} · ¥${o.price || 0} · ${new Date(o.t).toLocaleString('zh-CN')}</div>
      </div>
    `;
    box.appendChild(div);
  });
}

function openShopEdit(item) {
  editingShopId = item ? item.id : null;
  pendingShopImage = item ? (item.img || '') : '';
  document.getElementById('shopEditTitle').textContent = item ? '编辑商品' : '添加商品';
  document.getElementById('shopNameInput').value = item ? (item.name || '') : '';
  document.getElementById('shopPriceInput').value = item ? (item.price || '') : '';
  document.getElementById('shopDescInput').value = item ? (item.desc || '') : '';
  const img = document.getElementById('shopImgPreview');
  const plus = document.getElementById('shopImgPlus');
  if (pendingShopImage) { img.src = pendingShopImage; img.style.display = 'block'; plus.style.display = 'none'; }
  else { img.style.display = 'none'; plus.style.display = 'block'; }
  document.getElementById('shopEditModal').classList.remove('hidden');
}
function closeShopEdit() {
  document.getElementById('shopEditModal').classList.add('hidden');
}

function openShopDetail(id) {
  const it = shopItems.find(x => x.id === id);
  if (!it) return;
  currentDetailId = id;
  document.getElementById('detailImg').src = it.img || '';
  document.getElementById('detailName').textContent = it.name || '未命名';
  document.getElementById('detailPrice').textContent = '¥' + (it.price || 0);
  document.getElementById('detailDesc').textContent = it.desc || '（暂无介绍）';
  document.getElementById('shopDetailModal').classList.remove('hidden');
}
function closeShopDetail() {
  document.getElementById('shopDetailModal').classList.add('hidden');
}

function buyForTa(it) {
  const taName = load('ta_name', 'TA');
  const cardId = Date.now() + '_buy_' + Math.random().toString(36).slice(2, 8);
  const msg = { type: 'shopcard', sender: 'me', title: `我给${taName}赠送了商品`, sub: it.name, img: it.img, status: '接收', cardId, t: Date.now() };
  const msgs = load('our_messages', []);
  msgs.push(msg);
  save('our_messages', msgs);
  renderShopCard(msg);
  shopOrders.push({
    id: cardId, direction: 'me_to_ta', itemId: it.id, name: it.name,
    price: it.price, img: it.img, t: Date.now()
  });
  saveShopOrders();
  setTimeout(() => {
    const all = load('our_messages', []);
    const m = all.find(x => x.cardId === cardId);
    if (m) { m.status = '已接收'; save('our_messages', all); }
    const el = document.querySelector(`[data-shop-card="${cardId}"] .shop-card-status .tag`);
    if (el) el.textContent = '已接收';
    addSystemTip('对方已收下');
  }, 3000 + Math.random() * 2000);
}

function helpPay(it) {
  const cardId = Date.now() + '_pay_' + Math.random().toString(36).slice(2, 8);
  const msg = { type: 'shopcard', sender: 'me', title: `我希望你帮付¥${it.price}`, sub: it.name, img: it.img, status: '未付款', cardId, t: Date.now() };
  const msgs = load('our_messages', []);
  msgs.push(msg);
  save('our_messages', msgs);
  renderShopCard(msg);
  setTimeout(() => {
    const all = load('our_messages', []);
    const m = all.find(x => x.cardId === cardId);
    if (m) { m.status = '已付款'; save('our_messages', all); }
    const el = document.querySelector(`[data-shop-card="${cardId}"] .shop-card-status .tag`);
    if (el) el.textContent = '已付款';
    addSystemTip('对方已付款');
    shopOrders.push({
      id: cardId, direction: 'ta_to_me', itemId: it.id, name: it.name,
      price: it.price, img: it.img, t: Date.now()
    });
    saveShopOrders();
  }, 5000 + Math.random() * 1000);
}

function taSendGift(it) {
  const taName = load('ta_name', 'TA');
  const cardId = Date.now() + '_tagift_' + Math.random().toString(36).slice(2, 8);
  const msg = { type: 'shopcard', sender: 'ta', title: `${taName}给我赠送了商品`, sub: it.name, img: it.img, status: '接收', cardId, clickable: true, t: Date.now() };
  const msgs = load('our_messages', []);
  msgs.push(msg);
  save('our_messages', msgs);
  renderShopCard(msg);
  shopOrders.push({
    id: cardId, direction: 'ta_to_me', itemId: it.id, name: it.name,
    price: it.price, img: it.img, t: Date.now()
  });
  saveShopOrders();
}

function renderShopCard(m) {
  const row = document.createElement('div');
  row.className = 'msg-row ' + (m.sender === 'me' ? 'me' : 'ta');
  if (m.cardId) row.dataset.shopCard = m.cardId;
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  const isMe = m.sender === 'me';
  const avatarUrl = isMe ? load('my_avatar', '') : load('ta_avatar', '');
  if (avatarUrl) { avatar.style.background = `url(${avatarUrl}) center/cover no-repeat`; avatar.textContent = ''; }
  else { const name = isMe ? load('my_name', '我') : load('ta_name', 'TA'); avatar.textContent = name.charAt(0); }
  const card = document.createElement('div');
  card.className = 'shop-card';
  card.innerHTML = `
    <div class="shop-card-top">
      <img src="${m.img || ''}" alt="">
      <div style="flex:1;">
        <div class="shop-card-title">${m.title}</div>
        <div class="shop-card-sub">${m.sub || ''}</div>
      </div>
    </div>
    <div class="shop-card-line"></div>
    <div class="shop-card-status"><span class="tag">${m.status}</span></div>
  `;
  if (m.clickable) {
    card.style.cursor = 'pointer';
    card.onclick = () => {
      const tag = card.querySelector('.tag');
      if (tag && tag.textContent === '接收') {
        tag.textContent = '已接收';
        const all = load('our_messages', []);
        const x = all.find(y => y.cardId === m.cardId);
        if (x) { x.status = '已接收'; save('our_messages', all); }
        addSystemTip('我已收下');
      }
    };
  }
  row.appendChild(avatar); row.appendChild(card);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addSystemTip(text) {
  const sys = document.createElement('div');
  sys.style.cssText = 'align-self:center;font-size:12px;color:#999;background:rgba(0,0,0,0.04);padding:4px 12px;border-radius:10px;';
  sys.textContent = text;
  messagesEl.appendChild(sys);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

/* ===== 纪念日逻辑 ===== */
function loadAnnivList() {
  try { return JSON.parse(localStorage.getItem('anniv_list') || '[]'); }
  catch (e) { return []; }
}
function saveAnnivList(list) {
  localStorage.setItem('anniv_list', JSON.stringify(list));
}

function renderAnniv() {
  const start = localStorage.getItem('anniv_start') || '';
  const daysEl = document.getElementById('annivDays');
  if (start) {
    const diff = Math.floor((Date.now() - new Date(start).getTime()) / 86400000);
    daysEl.textContent = diff >= 0 ? diff : 0;
  } else {
    daysEl.textContent = '--';
  }

  const list = loadAnnivList();
  const listEl = document.getElementById('annivList');
  if (list.length === 0) {
    listEl.innerHTML = '<div style="color:#999;font-size:13px;text-align:center;padding:20px;">还没有纪念日，点下面添加</div>';
    return;
  }
  listEl.innerHTML = '';
  list.forEach((item, idx) => {
    const div = document.createElement('div');
    div.className = 'anniv-item';
    const now = new Date();
    const target = new Date(now.getFullYear(), item.month - 1, item.day);
    if (target < now) target.setFullYear(now.getFullYear() + 1);
    const left = Math.ceil((target - now) / 86400000);
    div.innerHTML = `
      <div class="anniv-item-info">
        <div class="anniv-item-name">${item.name}</div>
        <div class="anniv-item-date">${item.month}月${item.day}日</div>
      </div>
      <div class="anniv-item-days">还有 ${left} 天</div>
      <button class="anniv-item-del">×</button>
    `;
    div.querySelector('.anniv-item-del').onclick = () => {
      list.splice(idx, 1);
      saveAnnivList(list);
      renderAnniv();
    };
    listEl.appendChild(div);
  });
}

document.getElementById('backFromAnnivBtn').onclick = () => showPage('homePage');

document.getElementById('editStartBtn').onclick = () => {
  const current = localStorage.getItem('anniv_start') || '';
  const v = prompt('输入在一起的起始日期（格式：2024-01-01）', current);
  if (v === null) return;
  const date = v.trim();
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { alert('格式不对，应该是 2024-01-01 这样'); return; }
  localStorage.setItem('anniv_start', date);
  renderAnniv();
};

document.getElementById('addAnnivBtn').onclick = () => {
  const name = prompt('纪念日名称（比如：我的生日）');
  if (!name) return;
  const dateStr = prompt('日期（格式：10-02）');
  if (!dateStr) return;
  const m = dateStr.match(/^(\d{1,2})-(\d{1,2})$/);
  if (!m) { alert('格式不对，应该是 10-02 这样'); return; }
  const list = loadAnnivList();
  list.push({ name: name.trim(), month: parseInt(m[1]), day: parseInt(m[2]) });
  saveAnnivList(list);
  renderAnniv();
};
