<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ttvc7</title>
<link rel="icon" href="IMG_20260923_234621.jpg">
<link rel="manifest" href="manifest.json">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #f5f5f5;
}

/* ===== 加载页 ===== */
#loading {
  position: fixed; inset: 0;
  background: linear-gradient(180deg, #ffffff 0%, #f7f7f7 50%, #ececec 100%);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 999; transition: opacity 0.7s ease; overflow: hidden;
}
#loading.fade-out { opacity: 0; pointer-events: none; }
.sparkle {
  position: absolute; width: 6px; height: 6px; border-radius: 50%;
  background: rgba(255, 255, 255, 0.9);
  box-shadow: 0 0 12px rgba(255, 255, 255, 1);
  animation: float 7s ease-in-out infinite, glow 3s ease-in-out infinite;
}
.sparkle:nth-child(1) { top: 20%; left: 15%; animation-delay: 0s; width: 5px; height: 5px; }
.sparkle:nth-child(2) { top: 28%; right: 14%; animation-delay: 1.2s; width: 8px; height: 8px; }
.sparkle:nth-child(3) { bottom: 34%; left: 20%; animation-delay: 2.4s; width: 4px; height: 4px; }
.sparkle:nth-child(4) { bottom: 28%; right: 18%; animation-delay: 3.6s; width: 7px; height: 7px; }
.sparkle:nth-child(5) { top: 46%; left: 8%; animation-delay: 4.8s; width: 5px; height: 5px; }
.sparkle:nth-child(6) { top: 58%; right: 10%; animation-delay: 2s; width: 4px; height: 4px; }
.sparkle:nth-child(7) { top: 70%; left: 30%; animation-delay: 5.5s; width: 3px; height: 3px; }
.sparkle:nth-child(8) { top: 15%; right: 35%; animation-delay: 3s; width: 4px; height: 4px; }
@keyframes float { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(0, -22px); } }
@keyframes glow { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
.ring {
  width: 130px; height: 130px; border-radius: 50%;
  border: 3px solid #d0d0d0;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 50px; box-shadow: 0 0 40px rgba(200, 200, 200, 0.35);
}
.dot {
  width: 26px; height: 26px; border-radius: 50%; background: #ffffff;
  box-shadow: 0 0 20px rgba(220, 200, 230, 0.9);
  animation: breathe 1.8s ease-in-out infinite;
}
@keyframes breathe { 0%, 100% { transform: scale(0.5); } 50% { transform: scale(1.25); } }
.loading-text { font-size: 14px; color: #9a9a9a; letter-spacing: 1.5px; margin-bottom: 36px; }
.wave {
  position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%);
  width: 180px; height: 40px;
  display: flex; align-items: flex-end; justify-content: center; gap: 6px;
}
.wave span {
  display: block; width: 3px; border-radius: 3px;
  background: linear-gradient(180deg, rgba(240, 210, 225, 0.9), rgba(250, 235, 245, 0.3));
  animation: waveMove 1.6s ease-in-out infinite;
}
.wave span:nth-child(1) { height: 8px; animation-delay: 0s; }
.wave span:nth-child(2) { height: 14px; animation-delay: 0.1s; }
.wave span:nth-child(3) { height: 20px; animation-delay: 0.2s; }
.wave span:nth-child(4) { height: 28px; animation-delay: 0.3s; }
.wave span:nth-child(5) { height: 36px; animation-delay: 0.4s; }
.wave span:nth-child(6) { height: 28px; animation-delay: 0.5s; }
.wave span:nth-child(7) { height: 20px; animation-delay: 0.6s; }
.wave span:nth-child(8) { height: 14px; animation-delay: 0.7s; }
.wave span:nth-child(9) { height: 8px; animation-delay: 0.8s; }
@keyframes waveMove { 0%, 100% { transform: scaleY(0.4); opacity: 0.5; } 50% { transform: scaleY(1); opacity: 1; } }

/* ===== 聊天界面 ===== */
#app {
  width: 100%; height: 100vh; height: 100dvh;
  background: #f5f5f5; display: flex; flex-direction: column; overflow: hidden;
}
.chat-header {
  height: 56px; background: #f7f7f7; border-bottom: 1px solid #e0e0e0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px; flex-shrink: 0;
}
.chat-header span { font-size: 17px; font-weight: 600; color: #111; }
.header-right { display: flex; align-items: center; gap: 14px; }
.header-btn {
  background: none; border: none; padding: 4px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
}
.header-btn svg { width: 22px; height: 22px; }
#openCardBtn { color: #07c160; font-size: 15px; }
#messages {
  flex: 1; overflow-y: auto; padding: 16px 12px;
  display: flex; flex-direction: column; gap: 16px;
  -webkit-overflow-scrolling: touch;
}
.msg-row { display: flex; align-items: flex-start; gap: 8px; max-width: 82%; }
.msg-row.me { align-self: flex-end; flex-direction: row-reverse; }
.msg-row.ta { align-self: flex-start; }
.avatar {
  width: 38px; height: 38px; border-radius: 6px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 600; color: #fff;
}
.msg-row.me .avatar { background: #576b95; }
.msg-row.ta .avatar { background: #e8a33d; }
.bubble {
  padding: 10px 14px; border-radius: 8px; font-size: 15px; line-height: 1.5;
  word-break: break-word; white-space: pre-wrap;
}
.msg-row.me .bubble { background: #95ec69; color: #111; }
.msg-row.ta .bubble { background: #fff; color: #111; }
.typing { display: inline-flex; gap: 4px; padding: 4px 0; }
.typing span { width: 6px; height: 6px; border-radius: 50%; background: #999; animation: blink 1.2s infinite; }
.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%,60%,100% { opacity: .3 } 30% { opacity: 1 } }
.chat-footer {
  display: flex; padding: 8px 10px; background: #f7f7f7;
  border-top: 1px solid #e0e0e0; gap: 8px; flex-shrink: 0;
  padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
}
#input {
  flex: 1; border: 1px solid #ddd; border-radius: 8px;
  padding: 10px 14px; font-size: 15px; outline: none; background: #fff;
}
#send {
  border: none; background: #07c160; color: #fff; padding: 0 20px;
  border-radius: 8px; font-size: 15px; font-weight: 500;
}
#send:active { opacity: .7; }
#send:disabled { opacity: .4; }

/* ===== 弹窗通用 ===== */
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 99; }
.modal.hidden { display: none; }
.modal-box {
  width: 90%; max-width: 400px; max-height: 80vh;
  background: #fff; border-radius: 12px;
  display: flex; flex-direction: column; overflow: hidden;
}
.modal-head {
  padding: 14px 16px; border-bottom: 1px solid #eee;
  display: flex; justify-content: space-between; align-items: center;
  font-weight: 600;
}
.modal-head button { background: none; border: none; font-size: 22px; color: #999; }
.modal-body { padding: 16px; overflow-y: auto; }
#cardInput { width: 100%; height: 70px; border: 1px solid #ddd; border-radius: 8px; padding: 10px; font-size: 14px; resize: none; outline: none; font-family: inherit; }
#addCardBtn { margin-top: 10px; width: 100%; padding: 10px; background: #07c160; color: #fff; border: none; border-radius: 8px; font-size: 15px; }
#cardList { margin-top: 16px; }
.card-item { padding: 10px 12px; background: #f7f7f7; border-radius: 8px; margin-bottom: 8px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.card-item span { flex: 1; word-break: break-word; }
.card-item button { background: none; border: none; color: #e74c3c; font-size: 18px; flex-shrink: 0; }

/* 设置面板：九宫格，一排两个 */
.settings-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  padding: 6px 0;
}
.settings-item {
  background: #f7f7f7;
  border-radius: 10px;
  padding: 18px 12px;
  text-align: center;
  font-size: 15px;
  color: #333;
  cursor: pointer;
  transition: background 0.2s;
}
.settings-item:active { background: #eee; }
.settings-item .icon {
  font-size: 22px;
  display: block;
  margin-bottom: 6px;
}
</style>
</head>
<body>

<!-- 加载页 -->
<div id="loading">
  <div class="sparkle"></div><div class="sparkle"></div>
  <div class="sparkle"></div><div class="sparkle"></div>
  <div class="sparkle"></div><div class="sparkle"></div>
  <div class="sparkle"></div><div class="sparkle"></div>
  <div class="ring"><div class="dot"></div></div>
  <div class="loading-text">正在连接你和 TA 的世界…</div>
  <div class="wave">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
  </div>
</div>

<!-- 聊天界面 -->
<div id="app">
  <header class="chat-header">
    <span id="taName">TA</span>
    <div class="header-right">
      <button class="header-btn" id="openSettingsBtn" title="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
      <button class="header-btn" id="openCardBtn">字卡</button>
    </div>
  </header>
  <div id="messages"></div>
  <footer class="chat-footer">
    <input id="input" type="text" placeholder="输入消息…" autocomplete="off">
    <button id="send">发送</button>
  </footer>
</div>

<!-- 字卡弹窗 -->
<div id="cardModal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <span>TA 的字卡库</span>
      <button id="closeCardBtn">×</button>
    </div>
    <div class="modal-body">
      <textarea id="cardInput" placeholder="输入一句 TA 可能说的话…"></textarea>
      <button id="addCardBtn">添加字卡</button>
      <div id="cardList"></div>
    </div>
  </div>
</div>

<!-- 设置弹窗 -->
<div id="settingsModal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <span>设置</span>
      <button id="closeSettingsBtn">×</button>
    </div>
    <div class="modal-body">
      <div class="settings-grid">
        <div class="settings-item" data-key="美化"><span class="icon">✨</span>美化</div>
        <div class="settings-item" data-key="外观"><span class="icon">🎨</span>外观</div>
        <div class="settings-item" data-key="聊天"><span class="icon">💬</span>聊天</div>
        <div class="settings-item" data-key="音乐"><span class="icon">🎵</span>音乐</div>
        <div class="settings-item" data-key="信箱"><span class="icon">✉️</span>信箱</div>
        <div class="settings-item" data-key="陪伴"><span class="icon">💗</span>陪伴</div>
      </div>
    </div>
  </div>
</div>

<script>
/* ===== 本地存储版 ===== */
const TA_NAME = 'TA';
const MY_NAME = '我';
const MIN_DELAY = 900;
const MAX_DELAY = 2200;

const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendEl = document.getElementById('send');
document.getElementById('taName').textContent = TA_NAME;

function load(key, def) {
  try {
    const v = localStorage.getItem(key);
    return v ? JSON.parse(v) : def;
  } catch (e) { return def; }
}
function save(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
}

let messages = load('our_messages', []);
let cards = load('our_cards', []);

setTimeout(() => {
  const loading = document.getElementById('loading');
  loading.classList.add('fade-out');
  setTimeout(() => loading.remove(), 700);
}, 3000);

function addMessage(sender, content, store = true) {
  const row = document.createElement('div');
  row.className = 'msg-row ' + (sender === 'me' ? 'me' : 'ta');
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = sender === 'me' ? MY_NAME : TA_NAME.charAt(0);
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = content;
  row.appendChild(avatar);
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  if (store) {
    messages.push({ sender, content, t: Date.now() });
    save('our_messages', messages);
  }
}

function showTyping() {
  const row = document.createElement('div');
  row.className = 'msg-row ta';
  row.id = 'typing';
  row.innerHTML = '<div class="avatar">' + TA_NAME.charAt(0) + '</div><div class="bubble"><span class="typing"><span></span><span></span><span></span></span></div>';
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
function hideTyping() { const t = document.getElementById('typing'); if (t) t.remove(); }

function drawCard() {
  if (cards.length === 0) return '（字卡库还是空的，点右上角添加一些吧）';
  return cards[Math.floor(Math.random() * cards.length)];
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = '';
  sendEl.disabled = true;
  addMessage('me', text);
  showTyping();
  const delay = MIN_DELAY + Math.random() * (MAX_DELAY - MIN_DELAY);
  await new Promise(r => setTimeout(r, delay));
  const reply = drawCard();
  hideTyping();
  addMessage('ta', reply);
  sendEl.disabled = false;
}
sendEl.addEventListener('click', sendMessage);
inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

messages.forEach(m => addMessage(m.sender, m.content, false));

/* 字卡 */
const cardModal = document.getElementById('cardModal');
document.getElementById('openCardBtn').onclick = () => { cardModal.classList.remove('hidden'); loadCards(); };
document.getElementById('closeCardBtn').onclick = () => cardModal.classList.add('hidden');

function loadCards() {
  const list = document.getElementById('cardList');
  if (cards.length === 0) {
    list.innerHTML = '<div style="color:#999;font-size:13px;">还没有字卡，加一条试试</div>';
    return;
  }
  list.innerHTML = '';
  cards.forEach((content, idx) => {
    const div = document.createElement('div');
    div.className = 'card-item';
    const s = document.createElement('span');
    s.textContent = content;
    const btn = document.createElement('button');
    btn.textContent = '×';
    btn.onclick = () => {
      cards.splice(idx, 1);
      save('our_cards', cards);
      loadCards();
    };
    div.appendChild(s); div.appendChild(btn);
    list.appendChild(div);
  });
}

document.getElementById('addCardBtn').onclick = () => {
  const input = document.getElementById('cardInput');
  const content = input.value.trim();
  if (!content) return;
  cards.push(content);
  save('our_cards', cards);
  input.value = '';
  loadCards();
};

/* 设置 */
const settingsModal = document.getElementById('settingsModal');
document.getElementById('openSettingsBtn').onclick = () => settingsModal.classList.remove('hidden');
document.getElementById('closeSettingsBtn').onclick = () => settingsModal.classList.add('hidden');

document.querySelectorAll('.settings-item').forEach(item => {
  item.onclick = () => {
    const key = item.dataset.key;
    alert('【' + key + '】功能正在开发中…');
  };
});
</script>
</body>
  </html>
