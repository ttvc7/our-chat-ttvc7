<body>

</div>

<!-- 聊天界面 -->
<div id="app">
  <header class="chat-header">
    <div class="header-left"></div>
    <span id="taName">TA</span>
    <div class="header-right">
      <button class="header-btn" id="openMenuBtn" title="菜单">
        <svg viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2.5" stroke-linecap="round">

        </svg>

    </div>
  </header>
  <div id="messages"></div>
  <footer class="chat-footer">
    <button class="footer-btn" id="voiceBtn" title="语音">
      <svg viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="9" width="3" height="6" rx="1.5" fill="#666"></rect>
        <path d="M9 5 Q9 12 9 19" stroke="#666" fill="none"></path>
        <path d="M12 3 Q12 12 12 21" stroke="#666" fill="none"></path>
        <path d="M15 5 Q15 12 15 19" stroke="#666" fill="none"></path>
        <rect x="18" y="9" width="3" height="6" rx="1.5" fill="#666"></rect>
      </svg>
    </button>
    <input id="input" type="text" placeholder="输入消息…" autocomplete="off">
    <button class="footer-btn" id="emojiBtn" title="表情">

      </svg>

    <button class="footer-btn" id="plusBtn" title="更多">

</div>
  <!-- 表情面板 -->
<div id="stickerPanel" class="sticker-panel hidden">
  <div class="sticker-head">
    <button class="sticker-tab active" data-tab="mine">我</button>
    <button class="sticker-tab" data-tab="ta">对方</button>
    <button class="sticker-add-btn" id="stickerAddBtn">+ 添加</button>
  </div>
  <div class="sticker-body" id="stickerBody"></div>
  <input type="file" id="stickerUpload" accept="image/*" multiple style="display:none;">
                                        </div>

<!-- 顶部菜单 -->
<div id="menuPopup">
  <div class="menu-item" id="menuSettings">设置</div>
  <div class="menu-item" id="menuCards">字卡库</div>
</div>
  <!-- 加号功能菜单 -->
<div id="plusMenu" class="plus-menu hidden">
  <div class="plus-grid">
    <div class="plus-item" data-key="transfer">
      <div class="plus-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

    <div class="plus-item" data-key="gift">
      <div class="plus-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="8" width="18" height="13" rx="2"></rect>
          <path d="M12 8 V21 M3 12 H21"></path>
          <path d="M8 8 Q5 4 8 4 Q11 4 12 8"></path>
          <path d="M16 8 Q19 4 16 4 Q13 4 12 8"></path>
        </svg>
      </div>

    </div>
    <div class="plus-item" data-key="survey">
      <div class="plus-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="4" width="16" height="18" rx="2"></rect>

          <path d="M4 12 A8 8 0 1 1 12 20"></path>
          <path d="M4 12 L2 9 M4 12 L7 10"></path>

</div>
  <!-- 转账输入弹窗 -->
<div id="transferModal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <span>转账</span>
      <button id="closeTransferBtn">×</button>
    </div>
    <div class="modal-body">
      <div class="transfer-target">
        <div class="transfer-avatar" id="transferAvatar">TA</div>
        <div class="transfer-name" id="transferName">TA</div>
      </div>
      <div class="transfer-input-row">
        <span class="transfer-yen">¥</span>
        <input type="number" id="transferAmount" placeholder="0.00" inputmode="decimal">
      </div>
      <input type="text" id="transferNote" placeholder="添加转账说明" class="transfer-note">
      <button class="btn-primary" id="confirmTransferBtn">确认转账</button>
    </div>
  </div>
</div>

<!-- 字卡弹窗 -->
<div id="cardModal" class="modal hidden">
  <div class="modal-box" id="cardBox">
    <div class="modal-head">
      <span id="cardTitle">字卡库</span>
      <button id="closeCardBtn">×</button>
    </div>
    <div class="modal-body">
      <div class="card-tabs">
        <div class="card-tab active" data-tab="main">主字卡</div>
        <div class="card-tab" data-tab="emoji">Emoji</div>
      </div>

      <div id="cardPanelMain">
        <textarea id="cardInput" placeholder="输入字卡内容…&#10;第一行写【分类名】就会自动归类，例如：&#10;【日常】"></textarea>
        <button id="addCardBtn">添加字卡</button>
        <div class="card-cats" id="cardCats"></div>
        <div id="cardList"></div>
      </div>

      <div id="cardPanelEmoji" style="display:none;">
        <textarea id="emojiInput" placeholder="输入颜文字，一行一个，例如：&#10;(｡･ω･｡)&#10;(^_^)&#10;>_<"></textarea>
        <button id="addEmojiBtn">添加颜文字</button>
        <div id="emojiList"></div>
      </div>

    </div>
  </div>
</div>

<!-- 设置弹窗 -->
<div id="settingsModal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <span>设置</span>
      <button id="closeSettingsBtn">×</button>
    </div>
    <div class="modal-body"></div>
  </div>
</div>

<script>
const MIN_DELAY = 900;
const MAX_DELAY = 2200;

const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');

function load(key, def) {
  try {
    const v = localStorage.getItem(key);
    return v ? JSON.parse(v) : def;
  } catch (e) { return def; }
}
function save(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
}

let messages = load('our_messages', []);
let cards = load('our_cards', []);

setTimeout(() => {
  const loading = document.getElementById('loading');
  if (loading) {
    loading.classList.add('fade-out');
    setTimeout(() => loading.remove(), 700);
  }
}, 2000);

function addMessage(sender, content, store = true) {
  const row = document.createElement('div');
  row.className = 'msg-row ' + (sender === 'me' ? 'me' : 'ta');
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  const ta = load('ta_name', 'TA');
  const my = load('my_name', '我');
  avatar.textContent = sender === 'me' ? my : ta.charAt(0);
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = content;
  row.appendChild(avatar);
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  if (store) {
    messages.push({ sender, content, t: Date.now() });
    save('our_messages', messages);
  }
}

/* 正在输入：改顶部标题 */
function showTyping() {
  const taNameEl = document.getElementById('taName');
  if (taNameEl && !taNameEl.dataset.typing) {
    taNameEl.dataset.original = taNameEl.textContent;
    taNameEl.dataset.typing = '1';
    taNameEl.textContent = '对方正在输入中…';
  }
}
function hideTyping() {
  const taNameEl = document.getElementById('taName');
  if (taNameEl && taNameEl.dataset.typing) {
    taNameEl.textContent = taNameEl.dataset.original || load('ta_name', 'TA');
    delete taNameEl.dataset.typing;
  }
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = '';
  addMessage('me', text);

  const rMin = load('reply_min', 1);
  const rMax = load('reply_max', 1);
  const dMin = load('delay_min', 5);
  const dMax = load('delay_max', 15);
  const emojiProb = load('emoji_prob', 10);
  const stickerProb = load('sticker_prob', 20);

  showTyping();

  const firstDelay = (Math.min(dMin, dMax) + Math.random() * Math.abs(dMax - dMin)) * 1000;
  await new Promise(r => setTimeout(r, firstDelay));

  const count = Math.min(rMin, rMax) + Math.floor(Math.random() * (Math.abs(rMax - rMin) + 1));

  const mainCards = cards.filter(c => (c.type || 'main') === 'main');
  const emojiCards = cards.filter(c => c.type === 'emoji');
  const stickerCards = cards.filter(c => c.type === 'sticker');

  for (let i = 0; i < count; i++) {
    if (i > 0) {
      const gap = 500 + Math.random() * 1500;
      await new Promise(r => setTimeout(r, gap));
      showTyping();
      await new Promise(r => setTimeout(r, 400));
    }
    let reply;
    const roll = Math.random() * 100;
    if (emojiCards.length > 0 && roll < emojiProb) {
      reply = emojiCards[Math.floor(Math.random() * emojiCards.length)].content;
    } else if (stickerCards.length > 0 && roll < emojiProb + stickerProb) {
      reply = stickerCards[Math.floor(Math.random() * stickerCards.length)].content;
    } else if (mainCards.length > 0) {
      reply = mainCards[Math.floor(Math.random() * mainCards.length)].content;
    } else {
      reply = '（字卡库还是空的，点右上角添加一些吧）';
    }
    hideTyping();
    addMessage('ta', reply);
  }

  hideTyping();
}
inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

messages.forEach(m => addMessage(m.sender, m.content, false));

/* ===== 字卡系统 ===== */
const cardModal = document.getElementById('cardModal');
document.getElementById('closeCardBtn').onclick = () => cardModal.classList.add('hidden');

let currentCat = 'all';

function parseCards(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(l => l);
  if (lines.length === 0) return [];
  let category = '';
  let startIdx = 0;
  const m = lines[0].match(/^【(.+?)】$/);
  if (m) {
    category = m[1].trim();
    startIdx = 1;
  }
  const result = [];
  for (let i = startIdx; i < lines.length; i++) {
    result.push({ content: lines[i], category });
  }
  return result;
}

function loadCards() {
  const list = document.getElementById('cardList');
  const catsBox = document.getElementById('cardCats');
  if (!list || !catsBox) return;

  const cats = new Set();
  cards.forEach(c => { if ((c.type === 'main' || !c.type) && c.category) cats.add(c.category); });

  catsBox.innerHTML = '';
  const allCat = document.createElement('div');
  allCat.className = 'card-cat' + (currentCat === 'all' ? ' active' : '');
  allCat.textContent = '全部';
  allCat.onclick = () => { currentCat = 'all'; loadCards(); };
  catsBox.appendChild(allCat);

  const noCat = document.createElement('div');
  noCat.className = 'card-cat' + (currentCat === '未分类' ? ' active' : '');
  noCat.textContent = '未分类';
  noCat.onclick = () => { currentCat = '未分类'; loadCards(); };
  catsBox.appendChild(noCat);

  cats.forEach(cat => {
    const el = document.createElement('div');
    el.className = 'card-cat' + (currentCat === cat ? ' active' : '');
    el.textContent = cat;
    el.onclick = () => { currentCat = cat; loadCards(); };
    catsBox.appendChild(el);
  });

  let filtered = cards.map((c, idx) => ({ ...c, _idx: idx }))
    .filter(c => c.type === 'main' || !c.type);
  if (currentCat === '未分类') {
    filtered = filtered.filter(c => !c.category);
  } else if (currentCat !== 'all') {
    filtered = filtered.filter(c => c.category === currentCat);
  }

  if (filtered.length === 0) {
    list.innerHTML = '<div style="color:#999;font-size:13px;text-align:center;padding:20px 0;">还没有字卡，加一条试试</div>';
    return;
  }
  list.innerHTML = '';
  filtered.forEach(card => {
    const div = document.createElement('div');
    div.className = 'card-item';
    const contentWrap = document.createElement('div');
    contentWrap.style.flex = '1';
    contentWrap.style.wordBreak = 'break-word';
    const s = document.createElement('div');
    s.textContent = card.content;
    s.style.fontSize = '14px';
    s.style.color = '#333';
    contentWrap.appendChild(s);
    if (card.category) {
      const tag = document.createElement('span');
      tag.textContent = card.category;
      tag.style.cssText = 'display:inline-block;font-size:11px;color:#999;background:#f0f0f0;padding:2px 8px;border-radius:8px;margin-top:6px;';
      contentWrap.appendChild(tag);
    }
    const btn = document.createElement('button');
    btn.textContent = '×';
    btn.onclick = () => {
      cards.splice(card._idx, 1);
      save('our_cards', cards);
      loadCards();
    };
    div.appendChild(contentWrap);
    div.appendChild(btn);
    list.appendChild(div);
  });
}

function loadEmojiList() {
  const list = document.getElementById('emojiList');
  if (!list) return;
  const emojis = cards.map((c, idx) => ({ ...c, _idx: idx })).filter(c => c.type === 'emoji');
  if (emojis.length === 0) {
    list.innerHTML = '<div style="color:#999;font-size:13px;text-align:center;padding:20px 0;">还没有颜文字</div>';
    return;
  }
  list.innerHTML = '';
  emojis.forEach(card => {
    const div = document.createElement('div');
    div.className = 'card-item';
    const s = document.createElement('div');
    s.textContent = card.content;
    s.style.flex = '1';
    const btn = document.createElement('button');
    btn.textContent = '×';
    btn.onclick = () => {
      cards.splice(card._idx, 1);
      save('our_cards', cards);
      loadEmojiList();
    };
    div.appendChild(s);
    div.appendChild(btn);
    list.appendChild(div);
  });
}

document.getElementById('addCardBtn').onclick = () => {
  const input = document.getElementById('cardInput');
  const text = input.value.trim();
  if (!text) return;
  const parsed = parseCards(text);
  if (parsed.length === 0) { alert('请至少写一行内容'); return; }
  parsed.forEach(p => {
    cards.push({ content: p.content, category: p.category, type: 'main' });
  });
  save('our_cards', cards);
  input.value = '';
  loadCards();
};

document.getElementById('addEmojiBtn').onclick = () => {
  const input = document.getElementById('emojiInput');
  const text = input.value.trim();
  if (!text) return;
  const lines = text.split('\n').map(l => l.trim()).filter(l => l);
  lines.forEach(l => {
    cards.push({ content: l, category: '', type: 'emoji' });
  });
  save('our_cards', cards);
  input.value = '';
  loadEmojiList();
};

/* 字卡标签切换 */
document.querySelectorAll('.card-tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.card-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const key = tab.dataset.tab;
    document.getElementById('cardPanelMain').style.display = key === 'main' ? '' : 'none';
    document.getElementById('cardPanelEmoji').style.display = key === 'emoji' ? '' : 'none';
    document.getElementById('cardPanelPat').style.display = key === 'pat' ? '' : 'none';
    document.getElementById('cardPanelSticker').style.display = key === 'sticker' ? '' : 'none';
    if (key === 'emoji') loadEmojiList();
  };
});

/* ===== 拍一拍：双击头像 ===== */
document.addEventListener('dblclick', function(e) {
  const avatar = e.target.closest('.avatar');
  if (!avatar) return;
  const row = avatar.closest('.msg-row');
  if (!row) return;

  const taName = load('ta_name', 'TA');
  const myName = load('my_name', '我');
  const patToTa = load('pat_to_ta', ['{我} 拍了拍 {TA}']);
  const patToMe = load('pat_to_me', ['{TA} 拍了拍 {我}']);

  let template;
  if (row.classList.contains('me')) {
    template = patToMe[Math.floor(Math.random() * patToMe.length)];
  } else {
    template = patToTa[0];
  }

  let text = template.replace(/\{我\}/g, myName).replace(/\{TA\}/g, taName);

  const sys = document.createElement('div');
  sys.style.cssText = 'align-self:center;font-size:12px;color:#999;background:rgba(0,0,0,0.04);padding:4px 12px;border-radius:10px;';
  sys.textContent = text;
  messagesEl.appendChild(sys);
  messagesEl.scrollTop = messagesEl.scrollHeight;
});

/* ===== 顶部菜单 ===== */
(function() {
  const menuPopup = document.getElementById('menuPopup');
  const openMenuBtn = document.getElementById('openMenuBtn');
  if (openMenuBtn && menuPopup) {
    openMenuBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      menuPopup.classList.toggle('show');
    });
    document.addEventListener('click', () => {
      menuPopup.classList.remove('show');
    });
    menuPopup.addEventListener('click', (e) => e.stopPropagation());
  }
  const menuSettings = document.getElementById('menuSettings');
  if (menuSettings) {
    menuSettings.onclick = () => {
      if (menuPopup) menuPopup.classList.remove('show');
      const sm = document.getElementById('settingsModal');
      if (sm) sm.classList.remove('hidden');
    };
  }
  const menuCards = document.getElementById('menuCards');
  if (menuCards) {
    menuCards.onclick = () => {
      if (menuPopup) menuPopup.classList.remove('show');
      const cm = document.getElementById('cardModal');
      if (cm) cm.classList.remove('hidden');
      if (typeof loadCards === 'function') loadCards();
    };
  }
})();
  /* ===== 表情面板 ===== */
(function() {
  const panel = document.getElementById('stickerPanel');
  const body = document.getElementById('stickerBody');
  const addBtn = document.getElementById('stickerAddBtn');
  const upload = document.getElementById('stickerUpload');
  const emojiBtn = document.getElementById('emojiBtn');
  let currentTab = 'mine';

  function loadStickers() {
    try { return JSON.parse(localStorage.getItem('my_stickers') || '[]'); } catch(e) { return []; }
  }
  function loadTaStickers() {
    try { return JSON.parse(localStorage.getItem('ta_stickers') || '[]'); } catch(e) { return []; }
  }
  function saveStickers(list) {
    if (currentTab === 'mine') localStorage.setItem('my_stickers', JSON.stringify(list));
    else localStorage.setItem('ta_stickers', JSON.stringify(list));
  }

  function render() {
    const list = currentTab === 'mine' ? loadStickers() : loadTaStickers();
    if (list.length === 0) {
      body.innerHTML = `<div class="sticker-empty">还没有表情哦<br>点右上角"+ 添加"上传图片</div>`;
      return;
    }
    body.innerHTML = '';
    list.forEach((url, idx) => {
      const div = document.createElement('div');
      div.className = 'sticker-item';
      div.style.backgroundImage = `url(${url})`;
      const del = document.createElement('button');
      del.className = 'sticker-del';
      del.textContent = '×';
      del.onclick = (e) => {
        e.stopPropagation();
        list.splice(idx, 1);
        saveStickers(list);
        render();
      };
      div.appendChild(del);
      div.onclick = () => {
        if (currentTab === 'mine') {
          sendSticker(url);
        } else {
          alert('这是对方的表情，你只能添加/删除哦');
        }
      };
      body.appendChild(div);
    });
  }

  function compressImage(file, maxSize, cb) {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let w = img.width, h = img.height;
        if (w > h) { if (w > maxSize) { h = h * maxSize / w; w = maxSize; } }
        else { if (h > maxSize) { w = w * maxSize / h; h = maxSize; } }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        cb(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function sendSticker(url) {
    const row = document.createElement('div');
    row.className = 'msg-row me';
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = localStorage.getItem('my_name') ? JSON.parse(localStorage.getItem('my_name')) : '我';
    const img = document.createElement('img');
    img.src = url;
    img.style.maxWidth = '120px';
    img.style.maxHeight = '120px';
    img.style.borderRadius = '8px';
    row.appendChild(avatar);
    row.appendChild(img);
    document.getElementById('messages').appendChild(row);
    document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;

    const msgs = JSON.parse(localStorage.getItem('our_messages') || '[]');
    msgs.push({ sender: 'me', content: '[图片]', img: url, t: Date.now() });
    localStorage.setItem('our_messages', JSON.stringify(msgs));
  }

  emojiBtn.onclick = () => {
    if (panel.classList.contains('hidden')) {
      panel.classList.remove('hidden');
      render();
    } else {
      panel.classList.add('hidden');
    }
  };

  addBtn.onclick = () => upload.click();

  upload.onchange = (e) => {
    const files = Array.from(e.target.files);
    if (files.length === 0) return;
    const list = currentTab === 'mine' ? loadStickers() : loadTaStickers();
    let done = 0;
    files.forEach(f => {
      compressImage(f, 300, (url) => {
        list.push(url);
        done++;
        if (done === files.length) {
          saveStickers(list);
          render();
        }
      });
    });
    upload.value = '';
  };

  document.querySelectorAll('.sticker-tab').forEach(tab => {
    tab.onclick = () => {
      document.querySelectorAll('.sticker-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentTab = tab.dataset.tab;
      render();
    };
  });

  // 点击面板外部关闭
  document.addEventListener('click', (e) => {
    if (panel.classList.contains('hidden')) return;
    if (e.target.closest('#stickerPanel') || e.target.closest('#emojiBtn')) return;
    panel.classList.add('hidden');
  });
})();
/* ===== 加号菜单 ===== */
(function() {
  const plusMenu = document.getElementById('plusMenu');
  const plusBtn = document.getElementById('plusBtn');

  if (plusBtn && plusMenu) {
    plusBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      plusMenu.classList.toggle('hidden');
    });
    document.addEventListener('click', (e) => {
      if (e.target.closest('#plusMenu') || e.target.closest('#plusBtn')) return;
      plusMenu.classList.add('hidden');
    });
    plusMenu.addEventListener('click', (e) => e.stopPropagation());
  }

  document.querySelectorAll('.plus-item').forEach(item => {
    item.onclick = () => {
      const key = item.dataset.key;
      if (plusMenu) plusMenu.classList.add('hidden');
      if (key === 'transfer') alert('转账功能开发中…');
      if (key === 'gift') alert('礼物功能开发中…');
      if (key === 'survey') alert('问卷功能开发中…');
      if (key === 'continue') alert('继续说功能开发中…');
    };
  });
})();
</script>
